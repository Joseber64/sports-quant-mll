name: Quant Sports AI

on:

  schedule:
    - cron: "*/15 * * * *"

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: |
          mkdir -p database
          mkdir -p data/raw
          mkdir -p data/processed
          mkdir -p data/models

      - name: Collect Odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python src/collectors/odds_collector.py

      - name: Collect Historical
        run: |
          python src/collectors/historical_results.py

      - name: ELO Ratings
        run: |
          python src/features/elo_rating.py

      - name: Market Features
        run: |
          python src/features/market_features.py

      - name: Train Ensemble
        run: |
          python src/models/train_ensemble.py

      - name: Predict EV+
        run: |
          python src/models/predict_ev.py

      - name: ROI Tracking
        run: |
          python src/tracking/roi_tracker.py

      - name: Telegram Alerts
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python src/alerts/telegram.py
